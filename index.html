<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Google Form-like Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="form-container">
        <h1>Feedback Form</h1>
        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label>How satisfied are you with our service?</label>
                <label for="satisfied">
                    <input type="radio" id="satisfied" name="satisfaction" value="Very Satisfied"> Very Satisfied
                </label>
                
                <label for="neutral">
                    <input type="radio" id="neutral" name="satisfaction" value="Neutral"> Neutral
                </label>
                
                <label for="dissatisfied">
                    <input type="radio" id="dissatisfied" name="satisfaction" value="Dissatisfied"> Dissatisfied
                </label>
                
            </div>
            
            <div class="form-group">
                <label for="feedback">Additional Feedback</label>
                <textarea id="feedback" name="feedback" rows="4" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe" value="yes"> Subscribe to our newsletter
                </label>
            </div>
            
            <div class="form-group">
                <button type="submit">Submit Form</button>
            </div>
        </form>
    </div>
</body>
</html>
